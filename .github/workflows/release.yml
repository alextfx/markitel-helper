name: Release

# Builds signed + notarized Markitel Helper bundles and attaches them
# to a GitHub Release. Triggered by tags matching `helper-v*`. The
# repo root IS the helper project (no helper-app/ subdir prefix —
# this repo was extracted out of the main Markitel monorepo).
#
# Secrets required (configure under Settings → Secrets → Actions):
#
#   macOS:
#     APPLE_CERTIFICATE               base64 of the Developer ID Application .p12
#     APPLE_CERTIFICATE_PASSWORD      password that protects the .p12
#     APPLE_SIGNING_IDENTITY          e.g. "Developer ID Application: Your Name (TEAMID)"
#     APPLE_ID                        Apple ID email
#     APPLE_PASSWORD                  APP-SPECIFIC password from appleid.apple.com
#     APPLE_TEAM_ID                   10-char team ID
#
#   Windows (matrix row commented out below until cert lands):
#     WINDOWS_CERTIFICATE             base64 of the OV code-signing .pfx
#     WINDOWS_CERTIFICATE_PASSWORD    password that protects the .pfx
#
# NEVER put Apple-ID primary passwords in APPLE_PASSWORD — the notary
# service specifically requires app-specific passwords.

on:
  push:
    tags:
      - "helper-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. helper-v0.1.0). Used as the GitHub Release name."
        required: true

permissions:
  # Needed to attach build artifacts to the GitHub Release.
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build · ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            # DMG dropped — Tauri's bundle_dmg.sh is broken on macOS 26
            # (Tahoe) runners (invokes create-dmg with no positional args,
            # exits "Not enough arguments"). We build the .app here and
            # wrap it ourselves with hdiutil in a follow-up step.
            bundles: app
          # Windows row disabled until the OV code-signing cert is
          # purchased + the `WINDOWS_CERTIFICATE` secret is populated.
          # Re-enable by un-commenting (and make sure the secrets exist,
          # otherwise tauri-action will fail the sign step).
          # - platform: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   bundles: nsis,msi

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS deps
        run: npm ci --no-audit --no-fund

      - name: Build + sign + bundle (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          TAURI_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name || github.event.inputs.tag }}
          releaseName: "Markitel Helper ${{ github.ref_name || github.event.inputs.tag }}"
          releaseBody: |
            Markitel Helper release.

            Download:
              • macOS (Apple Silicon): `Markitel.Helper_<version>_aarch64.dmg`
              • Windows: pending OV code-signing cert
          releaseDraft: false
          prerelease: false

      # Wrap the .app in a DMG manually. Tauri's built-in DMG bundler
      # is broken on macOS 26 — invokes bundle_dmg.sh with no args.
      # `hdiutil` is built into macOS, no extra deps needed.
      - name: Build DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Markitel Helper.app"
          [ -d "$APP_PATH" ] || { echo "::error::App bundle not found at $APP_PATH"; exit 1; }
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DMG_NAME="Markitel.Helper_${VERSION}_aarch64.dmg"
          STAGE=$(mktemp -d)
          cp -R "$APP_PATH" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "MarkitelHelper" -srcfolder "$STAGE" -ov -format UDZO "$DMG_NAME"
          ls -la "$DMG_NAME"
          echo "DMG_PATH=$PWD/$DMG_NAME" >> "$GITHUB_ENV"

      # If the .app was code-signed, propagate that to the DMG too so
      # Gatekeeper accepts it. Skipped silently if no signing identity
      # was configured (ad-hoc signing leaves `APPLE_SIGNING_IDENTITY`
      # unset on the runner — same outcome as v0.0.7).
      - name: Sign DMG (macOS)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: codesign --force --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"

      - name: Attach DMG to release
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          files: ${{ env.DMG_PATH }}
          fail_on_unmatched_files: true
