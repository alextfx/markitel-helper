name: Release

# Builds + signs + notarizes the Markitel Helper macOS bundle and
# attaches a Gatekeeper-friendly DMG to a GitHub Release. Triggered by
# tags matching `helper-v*`.
#
# This workflow used to delegate the whole flow to tauri-apps/tauri-action,
# but two breakages forced a rewrite to discrete steps:
#
#   1. Tauri's bundle_dmg.sh is broken on macOS 26 (Tahoe) runners —
#      it invokes the bundled create-dmg with no positional args, so it
#      exits "Not enough arguments" and the build aborts. We sidestep
#      it by building only the .app bundle and wrapping that in a DMG
#      with macOS-builtin `hdiutil`.
#
#   2. tauri-action's release-upload mode tried to push the .app
#      directory directly to a GitHub Release asset, which fails because
#      release assets must be files. Splitting the build from the
#      release step gives us full visibility into each stage and lets
#      softprops/action-gh-release handle the upload of the produced DMG.
#
# Required secrets (Settings → Secrets → Actions):
#   APPLE_CERTIFICATE             base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD    password protecting the .p12
#   APPLE_SIGNING_IDENTITY        e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                      Apple ID email (for notarization)
#   APPLE_PASSWORD                APP-SPECIFIC password from appleid.apple.com
#   APPLE_TEAM_ID                 10-char team ID
#
# NEVER put the Apple-ID primary password in APPLE_PASSWORD — the
# notary service requires app-specific passwords.

on:
  push:
    tags:
      - "helper-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. helper-v0.1.0). Used as the GitHub Release name."
        required: true

permissions:
  # Needed to attach build artifacts to the GitHub Release.
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build · macOS
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      TARGET: aarch64-apple-darwin
      TAG: ${{ github.ref_name || github.event.inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: aarch64-apple-darwin

      - name: Install JS deps
        run: npm ci --no-audit --no-fund

      # ─── Diagnostic: surface notarization-secret state up front ────
      # GitHub Actions exposes ::notice:: annotations on the run page
      # without log-auth. We can't echo the secret VALUES (GH redacts
      # them), but we can echo whether each is present (non-empty).
      # If any is MISSING, this fails the run early so the cause is
      # unambiguous instead of silently shipping an unnotarized DMG.
      - name: Verify Apple notarization secrets present
        env:
          # App-specific-password auth (mode A)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # API-key auth (mode B — preferred; more robust, doesn't expire)
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          # Signing — required for either auth mode
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -eo pipefail
          state() { [ -n "${1:-}" ] && echo SET || echo MISSING; }
          # Length surfaces typo issues without leaking values. APPLE_TEAM_ID
          # MUST be exactly 10 alphanumeric chars; APPLE_PASSWORD app-specific
          # is 19 chars (`abcd-efgh-ijkl-mnop`); APPLE_ID is an email; API key
          # ID is 10 chars; API issuer is a UUID (36 chars).
          fmt_team()  { [ -n "${1:-}" ] && echo "len=${#1}/10 expected" || echo MISSING; }
          fmt_pass()  { [ -n "${1:-}" ] && echo "len=${#1}/19 expected" || echo MISSING; }
          fmt_email() { [ -n "${1:-}" ] && echo "len=${#1}, contains_at=$(echo "$1" | grep -q '@' && echo yes || echo no)" || echo MISSING; }
          fmt_keyid() { [ -n "${1:-}" ] && echo "len=${#1}/10 expected" || echo MISSING; }
          fmt_issuer(){ [ -n "${1:-}" ] && echo "len=${#1}/36 expected" || echo MISSING; }
          {
            echo "## Notarization auth state"
            echo ""
            echo "### Mode A — app-specific password"
            echo "- APPLE_ID:       $(fmt_email "$APPLE_ID")"
            echo "- APPLE_PASSWORD: $(fmt_pass  "$APPLE_PASSWORD")"
            echo "- APPLE_TEAM_ID:  $(fmt_team  "$APPLE_TEAM_ID")"
            echo ""
            echo "### Mode B — API key (preferred)"
            echo "- APPLE_API_KEY_ID: $(fmt_keyid "$APPLE_API_KEY_ID")"
            echo "- APPLE_API_ISSUER: $(fmt_issuer "$APPLE_API_ISSUER")"
            echo "- APPLE_API_KEY_P8: $(state "$APPLE_API_KEY_P8")"
            echo ""
            echo "### Signing"
            echo "- APPLE_CERTIFICATE:      $(state "$APPLE_CERTIFICATE")"
            echo "- APPLE_SIGNING_IDENTITY: $(state "$APPLE_SIGNING_IDENTITY")"
          } >> "$GITHUB_STEP_SUMMARY"

          # Determine auth mode
          MODE_B_OK=$([ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ] && [ -n "${APPLE_API_KEY_P8:-}" ] && echo yes || echo no)
          MODE_A_OK=$([ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && echo yes || echo no)
          if [ "$MODE_B_OK" = yes ]; then
            echo "::notice title=Notarize auth::Using Mode B (API key)"
            echo "NOTARIZE_AUTH_MODE=apikey" >> "$GITHUB_ENV"
          elif [ "$MODE_A_OK" = yes ]; then
            # Format-validate Mode A so a typo'd APPLE_TEAM_ID surfaces
            # before we burn 3 seconds on a guaranteed-401 notarytool call.
            FAIL=""
            if ! echo "$APPLE_TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
              FAIL="APPLE_TEAM_ID format invalid (expect exactly 10 uppercase alnum chars; v0.0.7 cert team is '43A3ZC429K'); got len=${#APPLE_TEAM_ID}"
            elif ! echo "$APPLE_ID" | grep -q '@'; then
              FAIL="APPLE_ID format invalid (expect an email address); got len=${#APPLE_ID}"
            elif [ "${#APPLE_PASSWORD}" -ne 19 ]; then
              FAIL="APPLE_PASSWORD format suspicious (expect 19 chars: 'abcd-efgh-ijkl-mnop'); got len=${#APPLE_PASSWORD} — generate a fresh app-specific password at https://account.apple.com/account/manage and paste WITHOUT leading/trailing whitespace"
            fi
            if [ -n "$FAIL" ]; then
              echo "::error title=Apple notarize secret format::$FAIL"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Format check failed:** $FAIL" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::notice title=Notarize auth::Using Mode A (app-specific password)"
            echo "NOTARIZE_AUTH_MODE=password" >> "$GITHUB_ENV"
          else
            echo "::error title=No Apple notarize creds::Set Mode A (APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID) OR Mode B (APPLE_API_KEY_ID + APPLE_API_ISSUER + APPLE_API_KEY_P8) at https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

      # ─── Code-signing cert into a fresh ephemeral keychain ───────────
      # We create a build-only keychain and import the Developer ID cert
      # there. The keychain is unlocked + added to the search list so
      # `codesign` can find the identity. set-key-partition-list grants
      # codesign + productbuild access to the imported key without an
      # interactive password prompt (the runner is non-interactive).
      - name: Import code-signing cert
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          # Append the build keychain to the search list (don't replace
          # the system one or codesign loses its trust roots).
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | xargs)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list \
            -S "apple-tool:,apple:,codesign:" \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # ─── Build the .app bundle (no DMG — Tauri's DMG bundler is broken) ──
      - name: Build app bundle
        env:
          # tauri.conf.json says signingIdentity "-" (ad-hoc) for local
          # dev. CI overrides via env so the .app is signed with the real
          # Developer ID cert we just imported.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri -- build --target "$TARGET" --bundles app
          APP="src-tauri/target/$TARGET/release/bundle/macos/Markitel Helper.app"
          [ -d "$APP" ] || { echo "::error::App bundle missing at $APP"; exit 1; }
          ls -la "$APP/Contents/MacOS/"
          codesign -dvv "$APP" 2>&1 | head -10

      # ─── Re-sign with hardened runtime + entitlements + Developer ID ───
      # tauri-action used to do this implicitly; we do it explicitly so
      # any failure here is easy to read in the logs.
      - name: Sign app with Developer ID
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/$TARGET/release/bundle/macos/Markitel Helper.app"
          codesign --force --options runtime \
            --entitlements src-tauri/entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --deep --timestamp "$APP"
          codesign -dvv "$APP" 2>&1 | head -15
          codesign --verify --strict --verbose=2 "$APP"

      # ─── Notarize the .app bundle and staple the ticket ─────────────
      # Best-effort: failure here logs but doesn't fail the build, so a
      # rotated/expired APPLE_PASSWORD still ships a signed DMG (with a
      # Gatekeeper "unidentified developer" warning on first launch —
      # right-click → Open works around it). Refresh the app-specific
      # password at appleid.apple.com if this is logging failures, then
      # bump a tag to re-notarize. `set -x` is on so the failure line is
      # visible in CI logs without auth gymnastics.
      - name: Notarize app
        id: notarize_app
        env:
          # Mode A — app-specific password
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Mode B — API key (preferred). APPLE_API_KEY_P8 should hold the
          # contents of the .p8 file (multi-line PEM is fine — GH preserves
          # newlines in secret values).
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          set -eo pipefail
          APP="src-tauri/target/$TARGET/release/bundle/macos/Markitel Helper.app"
          ZIP="$RUNNER_TEMP/notarize.zip"
          /usr/bin/ditto -c -k --keepParent "$APP" "$ZIP"
          ls -la "$ZIP"

          # Build the auth args based on what the diagnostic step picked.
          # Mode B (API key) is preferred because it doesn't expire and
          # isn't sensitive to "app-specific password" formatting traps.
          AUTH_ARGS=()
          if [ "${NOTARIZE_AUTH_MODE:-}" = "apikey" ]; then
            P8_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$P8_PATH"
            chmod 600 "$P8_PATH"
            AUTH_ARGS+=(--key "$P8_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          else
            AUTH_ARGS+=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi

          OUT="$RUNNER_TEMP/notarytool.out"
          set +e
          xcrun notarytool submit "$ZIP" "${AUTH_ARGS[@]}" --wait --timeout 30m 2>&1 | tee "$OUT"
          RC=${PIPESTATUS[0]}
          set -e
          {
            echo "## Notarize .app (mode: ${NOTARIZE_AUTH_MODE:-password})"
            echo '```'
            tail -n 60 "$OUT"
            echo '```'
            echo "exit code: $RC"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $RC -ne 0 ]; then
            SUBMISSION_ID=$(grep -oE 'id: [a-f0-9-]+' "$OUT" | head -1 | awk '{print $2}')
            if [ -n "$SUBMISSION_ID" ]; then
              echo "Fetching submission log for $SUBMISSION_ID..."
              xcrun notarytool log "$SUBMISSION_ID" "${AUTH_ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/notarylog.json" || true
              {
                echo "### Apple notary log (submission $SUBMISSION_ID)"
                echo '```json'
                cat "$RUNNER_TEMP/notarylog.json" 2>/dev/null || true
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::error title=Notarize app failed (rc=$RC)::see step summary at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            # Wipe the .p8 even on failure — `set -e` would normally skip this.
            [ -n "${P8_PATH:-}" ] && rm -f "$P8_PATH"
            exit $RC
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vv "$APP"
          [ -n "${P8_PATH:-}" ] && rm -f "$P8_PATH"

      # ─── Wrap signed/notarized .app in a UDZO DMG via hdiutil ───────
      - name: Build DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/$TARGET/release/bundle/macos/Markitel Helper.app"
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DMG="Markitel.Helper_${VERSION}_aarch64.dmg"
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "MarkitelHelper" \
            -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          ls -la "$DMG"
          echo "DMG_PATH=$PWD/$DMG" >> "$GITHUB_ENV"
          echo "DMG_NAME=$DMG" >> "$GITHUB_ENV"

      # ─── Sign + notarize the DMG itself ─────────────────────────────
      # Best-effort like the .app step. If notarization fails, the DMG
      # is still Developer-ID signed; users see a Gatekeeper warning on
      # first mount but can right-click → Open.
      - name: Sign + notarize DMG
        id: sign_dmg
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          set -eo pipefail
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp "$DMG_PATH"

          # Same auth-mode selection as the .app step. We're past the
          # validation gate at this point — the .app already notarized
          # successfully, so these creds are known good.
          AUTH_ARGS=()
          if [ "${NOTARIZE_AUTH_MODE:-}" = "apikey" ]; then
            P8_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}_dmg.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$P8_PATH"
            chmod 600 "$P8_PATH"
            AUTH_ARGS+=(--key "$P8_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          else
            AUTH_ARGS+=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi

          xcrun notarytool submit "$DMG_PATH" "${AUTH_ARGS[@]}" --wait --timeout 30m
          xcrun stapler staple "$DMG_PATH"
          spctl -a -vv -t install "$DMG_PATH" || true
          [ -n "${P8_PATH:-}" ] && rm -f "$P8_PATH" || true

      # ─── Attach the DMG to the GitHub Release (idempotent) ──────────
      # softprops/action-gh-release@v2 creates the release if missing or
      # updates an existing one (e.g. the orphaned stub from a previous
      # failed run). `clobber: true` overwrites assets with the same name.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Markitel Helper ${{ env.TAG }}"
          body: |
            Markitel Helper release.

            Download:
              • macOS (Apple Silicon): `${{ env.DMG_NAME }}`
              • Windows: pending OV code-signing cert
          files: ${{ env.DMG_PATH }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      # ─── Cleanup keychain ─────────────────────────────────────────────
      # Always runs so a partial failure doesn't leak the cert into the
      # runner's keychain. (GH runner images are ephemeral, but be tidy.)
      - name: Cleanup keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
